<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="56" text-anchor="middle" font-size="34" font-weight="800" fill="#1f2937" letter-spacing="-0.5">The trust tool</text>
  <text x="640" y="88" text-anchor="middle" font-size="16" fill="#64748b">Place any AI output before you act. Judge the <tspan font-style="italic">output</tspan>, not the brand.</text>

  <!-- Quadrants: grid 400..940 x, 130..670 y (origin bottom-left) -->
  <g stroke="#ffffff" stroke-width="4">
    <rect x="400" y="130" width="270" height="270" fill="#fef9c3"/>   <!-- TL Average+Large  yellow -->
    <rect x="670" y="130" width="270" height="270" fill="#fee2e2"/>   <!-- TR Precise+Large  red -->
    <rect x="400" y="400" width="270" height="270" fill="#d1fae5"/>   <!-- BL Average+Small  green -->
    <rect x="670" y="400" width="270" height="270" fill="#fef9c3"/>   <!-- BR Precise+Small  yellow -->
  </g>
  <!-- Red quadrant emphasis: the danger zone -->
  <rect x="670" y="130" width="270" height="270" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Colour badges (green / yellow / red dots) -->
  <circle cx="428" cy="428" r="9" fill="#16a34a"/>
  <circle cx="428" cy="158" r="9" fill="#eab308"/>
  <circle cx="698" cy="428" r="9" fill="#eab308"/>
  <circle cx="698" cy="158" r="9" fill="#dc2626"/>

  <!-- TL: Average + Large -->
  <text x="535" y="252" text-anchor="middle" font-size="13" fill="#a16207" font-weight="700" letter-spacing="0.5">AVERAGE · LARGE</text>
  <text x="535" y="280" text-anchor="middle" font-size="20" fill="#854d0e" font-weight="800">Verify the</text>
  <text x="535" y="306" text-anchor="middle" font-size="20" fill="#854d0e" font-weight="800">load-bearing bits</text>

  <!-- TR: Precise + Large  (RED, danger zone) -->
  <text x="805" y="236" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700" letter-spacing="0.5">PRECISE · LARGE</text>
  <text x="805" y="266" text-anchor="middle" font-size="22" fill="#991b1b" font-weight="800">Human in the loop</text>
  <text x="805" y="294" text-anchor="middle" font-size="15" fill="#b91c1c" font-weight="600">non-negotiable: a person owns it</text>

  <!-- BL: Average + Small  (GREEN) -->
  <text x="535" y="508" text-anchor="middle" font-size="13" fill="#047857" font-weight="700" letter-spacing="0.5">AVERAGE · SMALL</text>
  <text x="535" y="538" text-anchor="middle" font-size="22" fill="#065f46" font-weight="800">Lean in,</text>
  <text x="535" y="566" text-anchor="middle" font-size="22" fill="#065f46" font-weight="800">light review</text>

  <!-- BR: Precise + Small -->
  <text x="805" y="520" text-anchor="middle" font-size="13" fill="#a16207" font-weight="700" letter-spacing="0.5">PRECISE · SMALL</text>
  <text x="805" y="548" text-anchor="middle" font-size="20" fill="#854d0e" font-weight="800">Verify before</text>
  <text x="805" y="574" text-anchor="middle" font-size="20" fill="#854d0e" font-weight="800">you ship</text>

  <!-- X axis -->
  <line x1="400" y1="700" x2="945" y2="700" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="408" y="694" font-size="15" fill="#1e40af" font-weight="700">Average</text>
  <text x="932" y="694" text-anchor="end" font-size="15" fill="#1e40af" font-weight="700">Precise</text>
  <text x="670" y="718" text-anchor="middle" font-size="13" fill="#94a3b8">how exact the answer must be</text>

  <!-- Y axis -->
  <line x1="372" y1="670" x2="372" y2="125" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="364" y="664" text-anchor="end" font-size="15" fill="#1e40af" font-weight="700">Small</text>
  <text x="364" y="142" text-anchor="end" font-size="15" fill="#1e40af" font-weight="700">Large</text>
  <text x="345" y="400" text-anchor="middle" font-size="13" fill="#94a3b8" transform="rotate(-90 345 400)">consequences (blast radius)</text>

</svg>
